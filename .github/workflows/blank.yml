# วางที่ .github/workflows/unpack-project.yml แล้วกด Run workflow
# แตก project.zip เป็นโปรเจกต์ Unity จริง บน branch "unity-project" (ไม่ต้องใช้ Unity license)
name: Unpack Unity project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack to branch unity-project
        run: |
          mkdir /tmp/out && unzip -q project.zip -d /tmp/out
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan unity-project
          git rm -rf . -q
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "Unity project"
          git push -f origin unity-project
